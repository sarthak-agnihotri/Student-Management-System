services:
  mysql-db:
    image: mysql:5.7
    container_name: student-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: studentdb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - student-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      timeout: 20s
      retries: 10

  backend:
    build: ./backend
    container_name: student-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/studentdb?useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - student-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: student-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - student-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: student-phpmyadmin
    environment:
      PMA_HOST: mysql-db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - mysql-db
    networks:
      - student-network

volumes:
  mysql-data:

networks:
  student-network:
    driver: bridge